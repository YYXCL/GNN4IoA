[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ma-tgn"
version = "0.4.0"
description = "Dependency-aware task-node HGT-GRU for 6G multi-agent allocation"
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "numpy>=1.23", "pandas>=2.0", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["ma_tgn", "ma_tgn_data", "gcan_baseline"]

[tool.setuptools.package-dir]
ma_tgn = "2.模型/ma_tgn"
ma_tgn_data = "1.data/ma_tgn_data"
gcan_baseline = "baselines/gmatann/gcan_baseline"
