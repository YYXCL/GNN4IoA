[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ma-tgn"
version = "0.2.0"
description = "Task-conditioned heterogeneous continuous-time graph attention network for 6G multi-agent collaboration"
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "numpy>=1.23"]

[tool.setuptools]
packages = ["ma_tgn", "ma_tgn_data"]

[tool.setuptools.package-dir]
ma_tgn = "2.模型/ma_tgn"
ma_tgn_data = "1.data/ma_tgn_data"
