[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tc-mdsm"
version = "0.4.0"
description = "Task-conditioned multidimensional state modeling for multi-agent scheduling"
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "numpy>=1.26", "pandas>=2.0", "matplotlib>=3.8", "scipy>=1.11", "ortools>=9.10,<10"]

[tool.setuptools]
packages = ["tc_mdsm"]

[tool.setuptools.package-dir]
tc_mdsm = "2.模型/tc_mdsm"
