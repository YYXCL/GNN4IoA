[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gcan-task-allocation-baseline"
version = "0.1.0"
description = "GMATANN/GCAN single-subtask baseline for GNN4IoA"
requires-python = ">=3.9"
dependencies = ["torch>=2.1"]

[tool.setuptools]
packages = ["gcan_baseline"]
